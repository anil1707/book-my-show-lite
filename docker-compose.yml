
services:
  bookmyshow-postgres:
    image: postgres:16-alpine
    container_name: bookmyshow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bookmyshow
      POSTGRES_USER: bookmyshow
      POSTGRES_PASSWORD: bookmyshow123

    ports:
      - "5433:5432"

    volumes:
      - bookmyshow_data:/var/lib/postgresql/data

volumes:
  bookmyshow_data:
